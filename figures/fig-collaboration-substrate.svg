<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="478" viewBox="0 0 1160 478" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#5b6478"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#2e9e5b"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#e8862a"/></marker>
    <marker id="as" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#8a93a6"/></marker>
  </defs>
  <rect width="1160" height="478" fill="#ffffff"/>

  <text x="580" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#1c2440">The same collaboration, on a substrate</text>
  <text x="580" y="62" text-anchor="middle" font-size="13.5" font-style="italic" fill="#5b6478">every party attaches to trunks — and to nothing else</text>

  <!-- ===== trunks ===== -->
  <rect x="420" y="92" width="320" height="62" rx="10" fill="#fdf3e7" stroke="#e8862a" stroke-width="2.2"/>
  <text x="580" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2440">/world/feed</text>
  <text x="580" y="137" text-anchor="middle" font-size="11" fill="#3c455c">audience: everyone</text>

  <rect x="420" y="206" width="320" height="80" rx="10" fill="#f4f6fa" stroke="#1c2440" stroke-width="2.4"/>
  <text x="580" y="234" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2440">/shared/plan</text>
  <text x="580" y="254" text-anchor="middle" font-size="11" fill="#3c455c">audience: all collaborators</text>
  <text x="580" y="272" text-anchor="middle" font-size="11" font-style="italic" fill="#5b6478">the shared work</text>

  <rect x="420" y="338" width="320" height="68" rx="10" fill="#e9f7ef" stroke="#2e9e5b" stroke-width="2.2"/>
  <text x="580" y="364" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2440">/memories/bob</text>
  <text x="580" y="384" text-anchor="middle" font-size="11" fill="#3c455c">audience: Bob + his assistant</text>

  <text x="580" y="428" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.1" fill="#8a93a6">TRUNKS — AUTHORITATIVE, AUDIENCE-SCOPED</text>

  <!-- ===== left: humans ===== -->
  <rect x="40" y="196" width="176" height="66" rx="10" fill="#eaf1fc" stroke="#2f6fd0" stroke-width="2"/>
  <text x="128" y="222" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1c2440">Ann</text>
  <text x="128" y="242" text-anchor="middle" font-size="10.5" fill="#3c455c">through her workspace</text>

  <rect x="40" y="326" width="176" height="66" rx="10" fill="#eaf1fc" stroke="#2f6fd0" stroke-width="2"/>
  <text x="128" y="352" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1c2440">Bob</text>
  <text x="128" y="372" text-anchor="middle" font-size="10.5" fill="#3c455c">through his workspace</text>

  <path d="M216,226 L416,238" fill="none" stroke="#5b6478" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M216,346 L416,268" fill="none" stroke="#5b6478" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M216,372 L416,370" fill="none" stroke="#2e9e5b" stroke-width="1.8" marker-end="url(#ag)"/>

  <!-- ===== right: agents ===== -->
  <rect x="944" y="90" width="176" height="66" rx="10" fill="#f0ebfb" stroke="#7c5cd6" stroke-width="2"/>
  <text x="1032" y="116" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1c2440">A monitor</text>
  <text x="1032" y="136" text-anchor="middle" font-size="10.5" fill="#3c455c">through its workspace</text>

  <rect x="944" y="300" width="176" height="66" rx="10" fill="#f0ebfb" stroke="#7c5cd6" stroke-width="2"/>
  <text x="1032" y="326" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1c2440">Bob's assistant</text>
  <text x="1032" y="346" text-anchor="middle" font-size="10.5" fill="#3c455c">through its workspace</text>

  <path d="M940,120 L744,120" fill="none" stroke="#e8862a" stroke-width="2" marker-end="url(#ao)"/>
  <text x="842" y="110" text-anchor="middle" font-size="10.5" font-weight="700" fill="#e8862a">writes</text>

  <path d="M940,318 L744,262" fill="none" stroke="#5b6478" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M940,348 L744,376" fill="none" stroke="#2e9e5b" stroke-width="1.8" marker-end="url(#ag)"/>

  <!-- world -->
  <rect x="912" y="184" width="240" height="58" rx="10" fill="#ffffff" stroke="#8a93a6" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="1032" y="209" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1c2440">time &amp; the external world</text>
  <text x="1032" y="229" text-anchor="middle" font-size="10.5" font-style="italic" fill="#5b6478">still never consults anyone</text>
  <path d="M1032,184 L1032,160" fill="none" stroke="#8a93a6" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#as)"/>
  <text x="1046" y="176" font-size="10.5" fill="#8a93a6">observed</text>

  <!-- ===== the cut edges ===== -->
  <path d="M128,262 L128,326" fill="none" stroke="#d0d5df" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="116" y1="282" x2="140" y2="306" stroke="#d9433f" stroke-width="2.4"/>
  <line x1="140" y1="282" x2="116" y2="306" stroke="#d9433f" stroke-width="2.4"/>
  <text x="128" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#d9433f">no back channel</text>

  <path d="M1032,242 L1032,300" fill="none" stroke="#d0d5df" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="1020" y1="259" x2="1044" y2="283" stroke="#d9433f" stroke-width="2.4"/>
  <line x1="1044" y1="259" x2="1020" y2="283" stroke="#d9433f" stroke-width="2.4"/>

  <text x="1012" y="275" text-anchor="end" font-size="11" font-weight="700" fill="#d9433f">no back channel</text>

  <line x1="96" y1="440" x2="112" y2="456" stroke="#d9433f" stroke-width="2.2"/>
  <line x1="112" y1="440" x2="96" y2="456" stroke="#d9433f" stroke-width="2.2"/>
  <text x="124" y="453" font-size="11" fill="#8a93a6">a link the substrate does not provide — between any two parties, in either direction</text>

</svg>
