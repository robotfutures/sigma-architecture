<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="995" viewBox="0 0 1120 995" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<rect width="1120" height="995" fill="#ffffff"/>
<text x="560" y="48" text-anchor="middle" font-size="25" font-weight="700" font-style="normal" fill="#1c2440">Coherence: three conditions, seven capacities</text>
<text x="560" y="76" text-anchor="middle" font-size="14.5" font-weight="400" font-style="italic" fill="#5b6478">Conditions are assessed on the work. Capacities are what a group exercises — or lacks.</text>
<circle cx="560" cy="558" r="400" fill="#f6f9fd" stroke="#dbe0ea" stroke-width="1"/>
<circle cx="560" cy="558" r="326" fill="#e9f0f9" stroke="#dbe0ea" stroke-width="1"/>
<circle cx="560" cy="558" r="252" fill="#d9e4f2" stroke="#dbe0ea" stroke-width="1"/>
<circle cx="560" cy="558" r="176" fill="#ffffff" stroke="#dbe0ea" stroke-width="1"/>
<circle cx="508.0" cy="528.0" r="104" fill="#3b6fd4" fill-opacity="0.17" stroke="#3b6fd4" stroke-opacity="0.55" stroke-width="1.5"/>
<circle cx="612.0" cy="528.0" r="104" fill="#e8862a" fill-opacity="0.17" stroke="#e8862a" stroke-opacity="0.55" stroke-width="1.5"/>
<circle cx="560.0" cy="618.0" r="104" fill="#2e9e5b" fill-opacity="0.17" stroke="#2e9e5b" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="458" y="496" text-anchor="middle" font-size="13" font-weight="700" font-style="normal" fill="#3b6fd4" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Non-</text>
<text x="458" y="511" text-anchor="middle" font-size="13" font-weight="700" font-style="normal" fill="#3b6fd4" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">contradiction</text>
<text x="662" y="503" text-anchor="middle" font-size="13" font-weight="700" font-style="normal" fill="#e8862a" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Purpose</text>
<text x="560" y="673" text-anchor="middle" font-size="13" font-weight="700" font-style="normal" fill="#2e9e5b" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Grounded</text>
<text x="560" y="688" text-anchor="middle" font-size="13" font-weight="700" font-style="normal" fill="#2e9e5b" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">premises</text>
<path d="M664.0,712.2 A186,186 0 0,1 456.0,712.2" fill="none" stroke="#2e9e5b" stroke-opacity="0.55" stroke-width="3.0" stroke-linecap="round"/>
<path d="M378.1,519.3 A186,186 0 0,1 560.0,372.0" fill="none" stroke="#3b6fd4" stroke-opacity="0.55" stroke-width="3.0" stroke-linecap="round"/>
<path d="M560.0,372.0 A186,186 0 0,1 741.9,519.3" fill="none" stroke="#e8862a" stroke-opacity="0.55" stroke-width="3.0" stroke-linecap="round"/>
<text x="560" y="565" text-anchor="middle" font-size="20" font-weight="700" font-style="normal" fill="#1c2440" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Coherence</text>
<text x="560" y="780" text-anchor="middle" font-size="16.5" font-weight="600" font-style="normal" fill="#1c2440">1. Grounding</text>
<text x="560" y="799" text-anchor="middle" font-size="12.5" font-weight="400" font-style="italic" fill="#7a8398">establishing and repairing common ground</text>
<text x="560" y="336" text-anchor="middle" font-size="16.5" font-weight="600" font-style="normal" fill="#1c2440">2. Recomposing</text>
<text x="560" y="355" text-anchor="middle" font-size="12.5" font-weight="400" font-style="italic" fill="#7a8398">parts made apart still fit, and still mean, as one</text>
<text x="288" y="459" text-anchor="middle" font-size="16.5" font-weight="600" font-style="normal" fill="#1c2440">3. Mutual awareness</text>
<text x="288" y="478" text-anchor="middle" font-size="12.5" font-weight="400" font-style="italic" fill="#7a8398">what others did that bears on the work</text>
<text x="832" y="459" text-anchor="middle" font-size="16.5" font-weight="600" font-style="normal" fill="#1c2440">4. Timely reckoning</text>
<text x="832" y="478" text-anchor="middle" font-size="12.5" font-weight="400" font-style="italic" fill="#7a8398">while the context is still warm</text>
<text x="560" y="847" text-anchor="middle" font-size="16.5" font-weight="600" font-style="normal" fill="#1c2440">5. Attributed judgment</text>
<text x="560" y="866" text-anchor="middle" font-size="12.5" font-weight="400" font-style="italic" fill="#7a8398">every consequential decision has a named owner</text>
<text x="197" y="558" text-anchor="middle" font-size="16.5" font-weight="600" font-style="normal" fill="#1c2440">6. Rules of engagement</text>
<text x="197" y="577" text-anchor="middle" font-size="12.5" font-weight="400" font-style="italic" fill="#7a8398">who may do what is known, not assumed</text>
<text x="923" y="558" text-anchor="middle" font-size="16.5" font-weight="600" font-style="normal" fill="#1c2440">7. Accountability</text>
<text x="923" y="577" text-anchor="middle" font-size="12.5" font-weight="400" font-style="italic" fill="#7a8398">a name carries consequence, and standing is real</text>
<circle cx="48" cy="127" r="8" fill="#d9e4f2" stroke="#a8b0c0"/>
<text x="66" y="132" text-anchor="start" font-size="11.5" font-weight="400" font-style="normal" fill="#5b6478">Ring 1 — Produces the conditions</text>
<circle cx="48" cy="154" r="8" fill="#e9f0f9" stroke="#a8b0c0"/>
<text x="66" y="159" text-anchor="start" font-size="11.5" font-weight="400" font-style="normal" fill="#5b6478">Ring 2 — Makes that possible</text>
<circle cx="48" cy="181" r="8" fill="#f6f9fd" stroke="#a8b0c0"/>
<text x="66" y="186" text-anchor="start" font-size="11.5" font-weight="400" font-style="normal" fill="#5b6478">Ring 3 — Upholds judgment</text>
</svg>
